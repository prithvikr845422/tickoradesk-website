<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TickoraDesk — Premium Hybrid Kanban CRM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* [Purana CSS wahi rakho jo maine abhi diya tha] */
        :root { --bg-light: #F4F7FC; --cyan: #00BCD4; }
        body { background-color: var(--bg-light); font-family: sans-serif; margin:0; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .login-container { width:400px; padding:32px; background:#fff; border-radius:16px; border:1px solid #E2E8F0; text-align:center; }
        .dashboard-container { width:100%; max-width:1440px; padding:32px; display:none; flex-direction:column; gap:24px; }
        .kanban-board { display:grid; grid-template-columns:repeat(5,1fr); gap:16px; }
        .kanban-column { background:#EBF1FA; border-radius:12px; padding:16px; min-height:500px; }
    </style>
</head>
<body>

    <div class="login-container" id="loginBox">
        <h3>TickoraDesk CRM</h3>
        <input type="text" id="adminUser" placeholder="Username" style="width:100%; margin:10px 0; padding:10px;">
        <input type="password" id="adminPass" placeholder="Password" style="width:100%; margin:10px 0; padding:10px;">
        <button onclick="checkAdminLogin()" style="width:100%; padding:10px; background:#00BCD4; border:none; color:white;">Login</button>
    </div>

    <div class="dashboard-container" id="dashBox">
        <div class="dash-header"><h1>Deal Pipeline</h1><button onclick="adminLogout()">Log Out</button></div>
        <div class="kanban-board">
            <div class="kanban-column" id="container-open" ondragover="event.preventDefault()" ondrop="dropCard(event, 'open')"><h3>NEW</h3></div>
            <div class="kanban-column" id="container-hot" ondragover="event.preventDefault()" ondrop="dropCard(event, 'hot')"><h3>HOT</h3></div>
            <div class="kanban-column" id="container-cold" ondragover="event.preventDefault()" ondrop="dropCard(event, 'cold')"><h3>COLD</h3></div>
            <div class="kanban-column" id="container-closed" ondragover="event.preventDefault()" ondrop="dropCard(event, 'closed')"><h3>WON</h3></div>
            <div class="kanban-column" id="container-dead" ondragover="event.preventDefault()" ondrop="dropCard(event, 'dead')"><h3>LOST</h3></div>
        </div>
    </div>

    <script>
        // PAGE LOAD HOTE HI CHECK KAREGA
        window.onload = function() {
            if (localStorage.getItem('crm_logged_in') === 'true') {
                showDashboard();
            }
        };

        function checkAdminLogin() {
            if (document.getElementById("adminUser").value === "prithvi" && document.getElementById("adminPass").value === "tickora2026") {
                localStorage.setItem('crm_logged_in', 'true');
                showDashboard();
            } else { alert("Invalid Credentials!"); }
        }

        function showDashboard() {
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("dashBox").style.display = "flex";
            fetchLeads();
        }

        function adminLogout() {
            localStorage.removeItem('crm_logged_in');
            location.reload();
        }

        function fetchLeads() {
            fetch('https://crm.tickoradesk.com/get_leads.php')
            .then(res => res.json())
            .then(leads => {
                leads.forEach(lead => {
                    const status = lead.status || 'open';
                    document.getElementById('container-' + status).innerHTML += `
                        <div class="lead-card" id="lead-${lead.id}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain', 'lead-${lead.id}')">
                            <b>${lead.name}</b>
                        </div>`;
                });
            });
        }
        
        function dropCard(event, targetStatus) {
            var cardId = event.dataTransfer.getData("text/plain");
            fetch('https://crm.tickoradesk.com/update_status.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: cardId, status: targetStatus })
            });
            document.getElementById('container-' + targetStatus).appendChild(document.getElementById(cardId));
        }
    </script>
</body>
</html>
