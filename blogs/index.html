<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TickoraDesk Blogs</title>

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Manrope',sans-serif;
    }

    body{
      background:#f4f7fc;
      padding:60px 30px;
      color:#0f172a;
    }

    .top{
      text-align:center;
      margin-bottom:50px;
    }

    .top h1{
      font-size:48px;
      font-weight:800;
      margin-bottom:10px;
    }

    .top p{
      color:#64748b;
      font-size:18px;
    }

    .blog-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:30px;
      max-width:1400px;
      margin:auto;
    }

    .blog-card{
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 25px rgba(0,0,0,0.06);
      transition:0.3s;
    }

    .blog-card:hover{
      transform:translateY(-8px);
      box-shadow:0 18px 35px rgba(0,0,0,0.1);
    }

    .blog-img{
      width:100%;
      height:220px;
      object-fit:cover;
    }

    .blog-content{
      padding:25px;
    }

    .blog-tag{
      display:inline-block;
      background:#00BCD4;
      color:white;
      padding:6px 14px;
      border-radius:50px;
      font-size:12px;
      font-weight:700;
      margin-bottom:15px;
    }

    .blog-title{
      font-size:24px;
      font-weight:800;
      margin-bottom:12px;
      line-height:1.3;
    }

    .blog-desc{
      color:#64748b;
      font-size:15px;
      line-height:1.7;
      margin-bottom:22px;
    }

    .read-btn{
      display:inline-block;
      text-decoration:none;
      background:#00BCD4;
      color:white;
      padding:12px 22px;
      border-radius:10px;
      font-weight:700;
      transition:0.2s;
    }

    .read-btn:hover{
      opacity:0.9;
    }

  </style>
</head>

<body>

  <div class="top">
    <h1>TickoraDesk Blogs 🚀</h1>
    <p>Insights, AI support guides, SaaS growth & customer success strategies.</p>
  </div>

  <div class="blog-grid">

    <!-- BLOG 1 -->

    <div class="blog-card">

      <img 
      src="https://images.unsplash.com/photo-1551434678-e076c223a692?q=80&w=1200"
      class="blog-img">

      <div class="blog-content">

        <div class="blog-tag">
          AI Support
        </div>

        <div class="blog-title">
          AI Ticketing Guide for Modern Support Teams
        </div>

        <div class="blog-desc">
          Learn how AI-powered ticketing systems improve response times,
          automate workflows and increase customer satisfaction.
        </div>

        <a href="/blogs/ai-ticketing-guide.html" class="read-btn">
          Read More
        </a>

      </div>
    </div>

  </div>

</body>
</html>
